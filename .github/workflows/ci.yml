name: CI

on:
  push:
    branches-ignore:
      - main  # main is covered by the publish workflow on tag push
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then sudo apt-get install -y ffmpeg
          elif [ "$RUNNER_OS" == "macOS" ]; then brew install ffmpeg
          elif [ "$RUNNER_OS" == "Windows" ]; then choco install ffmpeg
          fi
        shell: bash

      - name: Install package and dev dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short